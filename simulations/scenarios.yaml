  - label: Caller 8 - Riley Davis (No Caller ID, Next Wednesday)
    instructions: |
      PERSONA: Riley Davis, calling from a private work phone.
      OPENING LINE: "Good morning, I would like to book a slot for next Wednesday at eleven AM if possible."
      FACTS:
      - Full name: Riley Davis
      - Phone number: "555-432-1098" (provide only when asked)
      DO, IN ORDER:
      1. Ask for next Wednesday at 11 AM.
      2. If 11 AM is available, select it. If not, pick the closest morning slot.
      3. Provide name Riley Davis and phone 555-432-1098 when asked.
      4. Confirm the booking details.
    agent_expectations: |
      The agent must request name and phone number since caller ID is absent, confirm details,
      and book the appointment.
    tags:
      feature: booking
    userdata:
      caller_phone: null
      expected_booking:
        patient_name: "Riley Davis"
        patient_phone: "+15554321098"

