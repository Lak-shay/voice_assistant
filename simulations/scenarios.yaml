      3. Provide name Taylor Brooks and confirm.
    agent_expectations: |
      The agent must check Tuesday afternoon/evening slots, offer appropriate openings after 4 PM,
      collect name, and book the appointment.
    tags:
      feature: booking
    userdata:
      caller_phone: "+15555678901"
      expected_booking:
        patient_name: "Taylor Brooks"
        patient_phone: "+15555678901"

